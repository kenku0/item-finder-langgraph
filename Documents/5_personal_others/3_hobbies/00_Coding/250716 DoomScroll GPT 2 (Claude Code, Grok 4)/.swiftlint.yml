# SwiftLint Configuration for Doomscroll GPT
# Based on Airbnb Swift Style Guide

disabled_rules:
  - trailing_whitespace
  - todo
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - conditional_returns_on_newline
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

included:
  - DoomscrollGPT

excluded:
  - Carthage
  - Pods
  - DoomscrollGPT/Resources

# Rule configurations
line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - z

nesting:
  type_level:
    warning: 3
    error: 5
  statement_level:
    warning: 5
    error: 10

force_cast: error
force_try: error
force_unwrapping: error

custom_rules:
  no_direct_standard_out_logs:
    name: "No Direct Standard Out Logs"
    regex: '(print|NSLog)\s*\('
    message: "Use os_log instead of print or NSLog"
    severity: warning